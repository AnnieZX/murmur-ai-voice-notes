<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Murmur — AI Voice Notes</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark"></span>
        <span class="brand-name">Murmur</span>
      </div>

      <nav>
        <ul class="nav-list" id="navList">
          <li><button class="nav-item" data-view="all">All Notes <span class="nav-count" id="countAll"></span></button></li>
          <li><button class="nav-item" data-view="favorites">Favorites <span class="nav-count" id="countFavorites"></span></button></li>
          <li><button class="nav-item" data-view="tasks">Tasks <span class="nav-count" id="countTasks"></span></button></li>
          <li><button class="nav-item" data-view="topics">Topics <span class="nav-count" id="countTopics"></span></button></li>
        </ul>
      </nav>

      <div>
        <p class="sidebar-section-title">Recent topics</p>
        <div class="topic-chip-list" id="recentTopicChips"></div>
      </div>

      <p class="sidebar-footer">Voice → transcript → understanding.</p>
    </aside>

    <div>
      <div class="mobile-topbar">
        <div class="brand">
          <span class="brand-mark"></span>
          <span class="brand-name">Murmur</span>
        </div>
      </div>

      <main class="main">
        <header class="main-header">
          <div>
            <h1 class="greeting" id="greeting">Good day</h1>
            <p class="date-line" id="dateLine"></p>
          </div>
          <div class="search-wrap">
            <span class="search-icon">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </span>
            <input type="text" class="search-input" id="searchInput" placeholder="Search your thoughts…" />
          </div>
        </header>

        <section class="recorder-card" id="recorderCard">
          <p class="recorder-prompt" id="recorderPrompt">What's on your mind?</p>

          <div class="recorder-controls" id="recorderControls">
            <button class="mic-button" id="micButton" aria-label="Start recording">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <rect x="9" y="2" width="6" height="12" rx="3"/>
                <path d="M5 10a7 7 0 0 0 14 0"/>
                <line x1="12" y1="19" x2="12" y2="22"/>
              </svg>
            </button>

            <div class="recorder-status" id="recorderStatusWrap">
              <span class="recorder-status-line" id="recorderStatus">Tap the microphone to start a memo.</span>
            </div>

            <div class="waveform" id="waveform" hidden></div>
            <span class="recorder-timer" id="recorderTimer" hidden>0:00</span>
            <div class="spinner" id="recorderSpinner" hidden></div>
            <button class="stop-button" id="stopButton" hidden>Stop</button>
          </div>

          <div class="recorder-error" id="recorderError" hidden>
            <span id="recorderErrorText"></span>
            <button class="retry-button" id="retryButton">Retry</button>
          </div>
        </section>

        <section id="viewContainer"></section>
      </main>
    </div>
  </div>

  <nav class="mobile-tabbar">
    <button class="mobile-tab" data-view="all">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16M4 12h16M4 19h10"/></svg>
      All
    </button>
    <button class="mobile-tab" data-view="favorites">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s-7-4.35-9.5-8.8C.6 8.6 2.4 5 6 5c2 0 3.3 1 4 2 .7-1 2-2 4-2 3.6 0 5.4 3.6 3.5 7.2C19 16.65 12 21 12 21z"/></svg>
      Favorites
    </button>
    <button class="mobile-tab" data-view="tasks">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      Tasks
    </button>
    <button class="mobile-tab" data-view="topics">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18M3 12h18"/></svg>
      Topics
    </button>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
